<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="30">
<meta name="robots" content="noindex">
<title>Actualizando el sistema</title>
<style>
	:root {
		--fondo: #f6f7f9;
		--tarjeta: #ffffff;
		--texto: #1f2933;
		--suave: #52606d;
		--borde: #e4e7eb;
		--acento: #d9822b;
	}
	@media (prefers-color-scheme: dark) {
		:root {
			--fondo: #14171a;
			--tarjeta: #1d2125;
			--texto: #e4e7eb;
			--suave: #9aa5b1;
			--borde: #2f353b;
			--acento: #f0a35e;
		}
	}
	* { box-sizing: border-box; }
	body {
		margin: 0;
		min-height: 100vh;
		display: grid;
		place-items: center;
		padding: 16px;
		background: var(--fondo);
		color: var(--texto);
		font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
	}
	main {
		max-width: 28rem;
		width: 100%;
		background: var(--tarjeta);
		border: 1px solid var(--borde);
		border-radius: 12px;
		padding: 2rem;
	}
	.indicador {
		display: inline-flex;
		align-items: center;
		gap: .5rem;
		color: var(--acento);
		font-size: .875rem;
		font-weight: 600;
	}
	.indicador::before {
		content: "";
		width: .5rem;
		height: .5rem;
		border-radius: 50%;
		background: currentColor;
		animation: latido 1.6s ease-in-out infinite;
	}
	@keyframes latido { 50% { opacity: .3; } }
	@media (prefers-reduced-motion: reduce) { .indicador::before { animation: none; } }
	h1 { font-size: 1.375rem; margin: .75rem 0 .5rem; }
	p { margin: 0 0 .75rem; color: var(--suave); }
	p:last-child { margin-bottom: 0; }
</style>
</head>
<body>
<main role="status" aria-live="polite">
	<span class="indicador">Mantenimiento en curso</span>
	<h1>Estamos actualizando el sistema</h1>
	<p>Vuelve a estar disponible en unos minutos. No hace falta que hagas nada: esta página se
	recarga sola.</p>
	<p>Lo que estuvieras haciendo antes de la actualización quedó guardado si llegaste a
	guardarlo.</p>
</main>
</body>
</html>
