<svg xmlns="http://www.w3.org/2000/svg" viewBox="180.0 60.0 1586.0 544.0" width="1586" height="544" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><rect x="180.0" y="60.0" width="1586.0" height="544.0" fill="#ffffff"/><defs><marker id="flecha" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker><marker id="msg" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffffff" stroke="#1f2933"/></marker></defs><rect x="200.0" y="80.0" width="1546.0" height="320.0" fill="#ffffff" stroke="#1f2933" stroke-width="1.5"/><text transform="translate(215.0 240.0) rotate(-90)" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#1f2933" font-weight="600">Accion de Mejora SGC</text><rect x="230.0" y="80.0" width="1516.0" height="160.0" fill="#f5f7fa" stroke="#52606d" stroke-width="1"/><line x1="260.0" y1="80.0" x2="260.0" y2="240.0" stroke="#52606d" stroke-width="1"/><g transform="translate(245.0 160.0) rotate(-90)"><text x="0.0" y="-7.5" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#1f2933" font-weight="600">Responsable de Calidad</text><text x="0.0" y="7.5" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#1f2933" font-weight="600">de Programa</text></g><rect x="230.0" y="240.0" width="1516.0" height="160.0" fill="#eef2f7" stroke="#52606d" stroke-width="1"/><line x1="260.0" y1="240.0" x2="260.0" y2="400.0" stroke="#52606d" stroke-width="1"/><g transform="translate(245.0 320.0) rotate(-90)"><text x="0.0" y="0.0" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#1f2933" font-weight="600">DPGC</text></g><path d="M212.0,480.0 L200.0,480.0 L200.0,584.0 L212.0,584.0" fill="none" stroke="#7b8794" stroke-width="1.2"/><text x="206.0" y="489.0" font-size="11" text-anchor="start" dominant-baseline="middle" fill="#52606d" font-weight="normal">Al guardar: Planificada fija avance 0; Ejecutada y Verificada</text><text x="206.0" y="502.8" font-size="11" text-anchor="start" dominant-baseline="middle" fill="#52606d" font-weight="normal">eficaz, 100. Al cambiar a otro estado, un avance heredado de 100 se</text><text x="206.0" y="516.5" font-size="11" text-anchor="start" dominant-baseline="middle" fill="#52606d" font-weight="normal">reinicia a 0; un avance manual menor se conserva.</text><path d="M672.0,480.0 L660.0,480.0 L660.0,584.0 L672.0,584.0" fill="none" stroke="#7b8794" stroke-width="1.2"/><text x="666.0" y="489.0" font-size="11" text-anchor="start" dominant-baseline="middle" fill="#52606d" font-weight="normal">Al guardar o borrar una acción: recalcular avance y semáforo del</text><text x="666.0" y="502.8" font-size="11" text-anchor="start" dominant-baseline="middle" fill="#52606d" font-weight="normal">plan vinculado. Al borrar, excluir esta acción del cálculo. No</text><text x="666.0" y="516.5" font-size="11" text-anchor="start" dominant-baseline="middle" fill="#52606d" font-weight="normal">depende solo de cambiar de estado.</text><path d="M338.0,160.0 L430.0,160.0" fill="none" stroke="#1f2933" stroke-width="1.4" marker-end="url(#flecha)"/><path d="M550.0,160.0 L630.0,160.0" fill="none" stroke="#1f2933" stroke-width="1.4" marker-end="url(#flecha)"/><path d="M750.0,160.0 L750.0,317.0 L855.0,317.0" fill="none" stroke="#1f2933" stroke-width="1.4" marker-end="url(#flecha)"/><path d="M880.0,342.0 L1030.0,342.0" fill="none" stroke="#1f2933" stroke-width="1.4" marker-end="url(#flecha)"/><path d="M1090.0,302.0 L1630.0,302.0 L1630.0,342.0" fill="none" stroke="#1f2933" stroke-width="1.4" marker-end="url(#flecha)"/><path d="M855.0,317.0 L855.0,302.0 L1290.0,302.0" fill="none" stroke="#1f2933" stroke-width="1.4" marker-end="url(#flecha)"/><path d="M1350.0,342.0 L1430.0,342.0" fill="none" stroke="#1f2933" stroke-width="1.4" marker-end="url(#flecha)"/><path d="M1430.0,342.0