<svg xmlns="http://www.w3.org/2000/svg" viewBox="180.0 60.0 1586.0 840.0" width="1586" height="840" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><rect x="180.0" y="60.0" width="1586.0" height="840.0" fill="#ffffff"/><defs><marker id="flecha" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker><marker id="msg" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffffff" stroke="#1f2933"/></marker></defs><rect x="200.0" y="80.0" width="1546.0" height="480.0" fill="#ffffff" stroke="#1f2933" stroke-width="1.5"/><text transform="translate(215.0 320.0) rotate(-90)" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#1f2933" font-weight="600">Autoevaluacion SGC</text><rect x="230.0" y="80.0" width="1516.0" height="160.0" fill="#f5f7fa" stroke="#52606d" stroke-width="1"/><line x1="260.0" y1="80.0" x2="260.0" y2="240.0" stroke="#52606d" stroke-width="1"/><g transform="translate(245.0 160.0) rotate(-90)"><text x="0.0" y="-7.5" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#1f2933" font-weight="600">Responsable de Calidad</text><text x="0.0" y="7.5" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#1f2933" font-weight="600">de Programa</text></g><rect x="230.0" y="240.0" width="1516.0" height="160.0" fill="#eef2f7" stroke="#52606d" stroke-width="1"/><line x1="260.0" y1="240.0" x2="260.0" y2="400.0" stroke="#52606d" stroke-width="1"/><g transform="translate(245.0 320.0) rotate(-90)"><text x="0.0" y="0.0" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#1f2933" font-weight="600">DPGC</text></g><rect x="230.0" y="400.0" width="1516.0" height="160.0" fill="#f5f7fa" stroke="#52606d" stroke-width="1"/><line x1="260.0" y1="400.0" x2="260.0" y2="560.0" stroke="#52606d" stroke-width="1"/><g transform="translate(245.0 480.0) rotate(-90)"><text x="0.0" y="0.0" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#1f2933" font-weight="600">Sistema (automático)</text></g><path d="M212.0,640.0 L200.0,640.0 L200.0,744.0 L212.0,744.0" fill="none" stroke="#7b8794" stroke-width="1.2"/><text x="206.0" y="649.0" font-size="11" text-anchor="start" dominant-baseline="middle" fill="#52606d" font-weight="normal">Al guardar una valoración de criterio: sincronizar sus evidencias</text><text x="206.0" y="662.8" font-size="11" text-anchor="start" dominant-baseline="middle" fill="#52606d" font-weight="normal">con Trazabilidad. Es aditivo: quitar una evidencia del selector no</text><text x="206.0" y="676.5" font-size="11" text-anchor="start" dominant-baseline="middle" fill="#52606d" font-weight="normal">borra el vínculo creado.</text><path d="M672.0,640.0 L660.0,640.0 L660.0,724.0 L672.0,724.0" fill="none" stroke="#7b8794" stroke-width="1.2"/><text x="666.0" y="649.0" font-size="11" text-anchor="start" dominant-baseline="middle" fill="#52606d" font-weight="normal">Al guardar una valoración de criterio: recalcular el nivel propuesto</text><text x="666.0" y="662.8" font-size="11" text-anchor="start" dominant-baseline="middle" fill="#52606d" font-weight="normal">del estándar. El nivel oficial requiere confirmación humana.</text><path d="M1132.0,640.0 L1120.0,640.0 L1120.0,724.0 L1132.0,724.0" fill="none" stroke="#7b8794" stroke-width="1.2"/><text x="1126.0" y="649.0" font-size="11" text-anchor="start" dominant-baseline="middle" fill="#52606d" font-weight="normal">Autoevaluación enviada (docstatus=1): se rechaza crear o editar</text><text x="1126.0" y="662.8" font-size="11" text-anchor="start" dominant-baseline="middle" fill="#52606d" font-weight="normal">valoraciones de criterio, antes de sincronizar sus evidencias.</text><path d="M212.0,776.0 L200.0,776.0 L200.0,880.0 L212.0,880.0" fill="none" stroke="#7b8794" stroke-width="1.2"/><text x="206.0" y="785.0" font-size="11" text-anchor="start" dominant-baseline="middle" fill="#52606d" font-weight="normal">Cerrar: exige todos los estándares confirmados. El mismo submit</text><text x="206.0" y="798.8" font-size="11" text-anchor="start" dominant-baseline="middle" fill="#52606d" font-weight="normal">congela el marco y registra la vigencia; si faltan confirmaciones,</text><text x="206.0" y="812.5" font-size="11" text-anchor="start" dominant-baseline="middle" fill="#52606d" font-weight="normal">no se persiste el cierre.</text><path d="M306.0,160.0 L430.0,160.0" fill="none" stroke="#1f2933" stroke-width="1.4" marker-end="url(#flecha)"/><path d="M550.0,160.0 L630.0,160.0" fill="none" stroke="#1f2933" stroke-width="1.4" marker-end="url(#flecha)"/><path d="M750.0,160.0 L750.0,295.0 L855.0,295.0" fill="none" stroke="#1f2933" stroke-width="1.4" marker-end="url(#flecha)"/><path d="M880.0,320.0 L1030.0,320.0" fill="none" stroke="#1f2933" stroke-width="1.4" marker-end="url(#flecha)"/><path d="M1030.0,320.0 L1030.0,160.0 L750.0,160.0" fill="none" stroke="#1f2933" stroke-width="1.4" marker-end="url(#flecha)"/><path d="M855.0,295.0 L855.0,280.0 L1290.0,280.0" fill="none" stroke="#1f2933" stroke-width="1.4" marker-end="url(#flecha)"/><path d="M1350.0,320.0 L1430.0,320.0" fill="none" stroke="#1f2933" stroke-width="1.4" marker-end="url(#flecha)"/><path d="M1490.0,360.0 L1490.0,440.0" fill="none" stroke="#1f2933" stroke-width="1.4" marker-end="url(#flecha)"/><path d="M1550.0,480.0 L1550.0,320.0 L1630.0,320.0" fill="none" stroke="#1f2933" stroke-width="1.4" marker-end="url(#flecha)"/><rect x="430.0" y="120.0" width="120.0" height="80.0" rx="10" fill="#ffffff" stroke="#1f2933" stroke-width="1.5"/><g transform="translate(436.0 125.0)" fill="none" stroke="#52606d" stroke-width="1"><circle cx="6" cy="4" r="3"/><path d="M0 13 q6 -8 12 0"/></g><text x="490.0" y="155.5" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#1f2933" font-weight="normal">Iniciar</text><text x="490.0" y="170.5" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#1f2933" font-weight="normal">evaluacion</text><rect x="630.0" y="120.0" width="120.0" height="80.0" rx="10" fill="#ffffff" stroke="#1f2933" stroke-width="1.5"/><g transform="translate(636.0 125.0)" fill="none" stroke="#52606d" stroke-width="1"><circle cx="6" cy="4" r="3"/><path d="M0 13 q6 -8 12 0"/></g><text x="690.0" y="155.5" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#1f2933" font-weight="normal">Enviar a</text><text x="690.0" y="170.5" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#1f2933" font-weight="normal">revision</text><rect x="1030.0" y="280.0" width="120.0" height="80.0" rx="10" fill="#ffffff" stroke="#1f2933" stroke-width="1.5"/><g transform="translate(1036.0 285.0)" fill="none" stroke="#52606d" stroke-width="1"><circle cx="6" cy="4" r="3"/><path d="M0 13 q6 -8 12 0"/></g><text x="1090.0" y="315.5" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#1f2933" font-weight="normal">Devolver a</text><text x="1090.0" y="330.5" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#1f2933" font-weight="normal">evaluacion</text><rect x="1230.0" y="280.0" width="120.0" height="80.0" rx="10" fill="#ffffff" stroke="#1f2933" stroke-width="1.5"/><g transform="translate(1236.0 285.0)" fill="none" stroke="#52606d" stroke-width="1"><circle cx="6" cy="4" r="3"/><path d="M0 13 q6 -8 12 0"/></g><text x="1290.0" y="323.0" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#1f2933" font-weight="normal">Consolidar</text><rect x="1430.0" y="280.0" width="120.0" height="80.0" rx="10" fill="#ffffff" stroke="#1f2933" stroke-width="1.5"/><g transform="translate(1436.0 285.0)" fill="none" stroke="#52606d" stroke-width="1"><circle cx="6" cy="4" r="3"/><path d="M0 13 q6 -8 12 0"/></g><text x="1490.0" y="323.0" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#1f2933" font-weight="normal">Cerrar</text><polygon points="855.0,295.0 880.0,320.0 855.0,345.0 830.0,320.0" fill="#ffffff" stroke="#1f2933" stroke-width="1.5"/><path d="M847.0,312.0 L863.0,328.0 M863.0,312.0 L847.0,328.0" stroke="#1f2933" stroke-width="2.5"/><text x="855.0" y="359.0" font-size="11" text-anchor="middle" dominant-baseline="middle" fill="#52606d" font-weight="normal">En revision</text><circle cx="1648.0" cy="320.0" r="18.0" fill="#ffffff" stroke="#c53030" stroke-width="4"/><text x="1648.0" y="352.0" font-size="11" text-anchor="middle" dominant-baseline="middle" fill="#52606d" font-weight="normal">Cerrada</text><circle cx="288.0" cy="160.0" r="18.0" fill="#ffffff" stroke="#2f855a" stroke-width="2"/><text x="288.0" y="192.0" font-size="11" text-anchor="middle" dominant-baseline="middle" fill="#52606d" font-weight="normal">Inicio</text><rect x="1430.0" y="440.0" width="120.0" height="80.0" rx="10" fill="#f0f4f8" stroke="#1f2933" stroke-width="1.5" stroke-dasharray="5 3"/><text x="1438.0" y="454.0" font-size="11" fill="#52606d">⚙</text><text x="1490.0" y="468.0" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#1f2933" font-weight="normal">Congelar marco y</text><text x="1490.0" y="483.0" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#1f2933" font-weight="normal">registrar</text><text x="1490.0" y="498.0" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#1f2933" font-weight="normal">vigencia</text></svg>
